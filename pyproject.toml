# Minimale Paket-Metadaten, damit IDEs (PyCharm & Co.) das Projekt
# als installierbares Paket erkennen (`pip install -e .`).
#
# ⚠️ Die eigentlichen Abhängigkeiten bleiben in requirements.txt
#    (eine einzige Quelle der Wahrheit – hier keine Duplikate).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-langchain"
version = "0.1.0"
description = "LangChain Workflows & Agents – Lernprojekt (LLM via OpenAI-kompatibler Endpoint)"
requires-python = ">=3.10"

# Top-Level-Pakete explizit nennen (Flat-Layout mit mehreren Paketen).
# → In Phase 2 hier noch "agents*" ergänzen!
[tool.setuptools.packages.find]
include = ["core*", "workflows*"]
